name: Automated Release (APK & Windows Receiver)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Android APK
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Setup environment file
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK artifact
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/PhoneMic-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-debug-apk
          path: release_assets/PhoneMic-debug.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Build Windows Receiver EXE & CLI Bundle
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Receiver
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller sounddevice numpy pystray pillow

      - name: Build PhoneMicReceiver.exe
        working-directory: windows_receiver
        run: |
          pyinstaller --clean PhoneMicReceiver.spec

      - name: Package Windows Receiver ZIP
        run: |
          mkdir release_assets -ErrorAction SilentlyContinue
          Copy-Item windows_receiver/fix_firewall.bat windows_receiver/dist/
          Copy-Item windows_receiver/phonemic_cli.py windows_receiver/dist/
          Copy-Item windows_receiver/README.md windows_receiver/dist/
          Compress-Archive -Path windows_receiver/dist/* -DestinationPath release_assets/PhoneMicReceiver-Windows.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMicReceiver-Windows
          path: release_assets/PhoneMicReceiver-Windows.zip
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Publish Unified GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Release (APK + Windows)
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: PhoneMic-debug-apk
          path: release_files

      - name: Download Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: PhoneMicReceiver-Windows
          path: release_files

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TITLE="PhoneMic ${TAG_NAME}"
            PRERELEASE=false
          else
            TAG_NAME="latest"
            TITLE="PhoneMic Latest Build ($(date +'%Y-%m-%d %H:%M'))"
            PRERELEASE=false
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          files: |
            release_files/PhoneMic-debug.apk
            release_files/PhoneMicReceiver-Windows.zip
          generate_release_notes: true
          body: |
            ## PhoneMic Automatic Release

            This release contains the latest compiled binaries for both Android and Windows:

            ### 📱 Android
            * **`PhoneMic-debug.apk`**: Install on your Android phone to stream microphone audio over Wi-Fi or USB tethering. Supports Studio (48 kHz), Balanced (24 kHz), and Economy (16 kHz) audio profiles.

            ### 💻 Windows & Cross-Platform PC
            * **`PhoneMicReceiver-Windows.zip`**: Includes:
              * **`PhoneMicReceiver.exe`**: Full Windows GUI with live signal chain (EQ, Noise Gate, Compressor, Voice Changer, Limiter).
              * **`phonemic_cli.py`**: Lightweight standalone CLI receiver with live terminal VU meters, multi-phone mixing, and real-time headphone monitoring (`M` key).
              * **`fix_firewall.bat`**: One-click Windows firewall rule configuration for USB tethering and Wi-Fi streaming.
