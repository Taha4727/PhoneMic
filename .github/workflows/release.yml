name: Manual Release (APK, Windows & Linux Receiver)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'PhoneMic Release'
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Android APK
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Setup environment file
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK artifact
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/PhoneMic-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMic-debug-apk
          path: release_assets/PhoneMic-debug.apk
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build Windows Receiver EXE & CLI Bundle
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Receiver
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r windows_receiver/requirements.txt

      - name: Build PhoneMicReceiver.exe
        working-directory: windows_receiver
        run: |
          pyinstaller --clean PhoneMicReceiver.spec

      - name: Package Windows Receiver ZIP
        run: |
          mkdir release_assets -ErrorAction SilentlyContinue
          Copy-Item windows_receiver/fix_firewall.bat windows_receiver/dist/
          Copy-Item windows_receiver/phonemic_cli.py windows_receiver/dist/
          Copy-Item windows_receiver/README.md windows_receiver/dist/
          Compress-Archive -Path windows_receiver/dist/* -DestinationPath release_assets/PhoneMicReceiver-Windows.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMicReceiver-Windows
          path: release_assets/PhoneMicReceiver-Windows.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Build Linux Receiver Binary & Cross-Distro Bundle
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux Receiver
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-venv \
            python3-pip \
            python3-tk \
            libportaudio2 \
            portaudio19-dev \
            pulseaudio-utils \
            libasound2-dev \
            xvfb \
            xauth

      - name: Set up Python build environment
        run: |
          python3 -m venv --system-site-packages .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/pip install pyinstaller -r windows_receiver/requirements.txt

      - name: Run receiver test suite
        working-directory: windows_receiver
        run: |
          xvfb-run -a ../.build-venv/bin/python tests/run_all.py

      - name: Build Linux PhoneMicReceiver binary
        working-directory: windows_receiver
        run: |
          ../.build-venv/bin/pyinstaller --clean PhoneMicReceiver.spec
          ./dist/PhoneMicReceiver --version
          ../.build-venv/bin/python phonemic_cli.py --version

      - name: Package Linux Receiver Tarball
        run: |
          mkdir -p release_assets staging/PhoneMicReceiver-Linux
          cp windows_receiver/dist/PhoneMicReceiver staging/PhoneMicReceiver-Linux/
          cp windows_receiver/phonemic_cli.py staging/PhoneMicReceiver-Linux/
          cp windows_receiver/phonemic_receiver.py staging/PhoneMicReceiver-Linux/
          cp windows_receiver/check_dependencies.py staging/PhoneMicReceiver-Linux/
          cp windows_receiver/requirements.txt staging/PhoneMicReceiver-Linux/
          cp windows_receiver/setup_linux.sh staging/PhoneMicReceiver-Linux/
          cp windows_receiver/start_receiver.sh staging/PhoneMicReceiver-Linux/
          cp windows_receiver/README.md staging/PhoneMicReceiver-Linux/
          cp -r windows_receiver/phonemic staging/PhoneMicReceiver-Linux/
          cp -r windows_receiver/assets staging/PhoneMicReceiver-Linux/
          cp -r windows_receiver/linux staging/PhoneMicReceiver-Linux/
          find staging/PhoneMicReceiver-Linux -type d -name "__pycache__" -exec rm -rf {} +
          chmod +x \
            staging/PhoneMicReceiver-Linux/PhoneMicReceiver \
            staging/PhoneMicReceiver-Linux/phonemic_cli.py \
            staging/PhoneMicReceiver-Linux/phonemic_receiver.py \
            staging/PhoneMicReceiver-Linux/setup_linux.sh \
            staging/PhoneMicReceiver-Linux/start_receiver.sh \
            staging/PhoneMicReceiver-Linux/linux/phonemic-receiver
          tar -czf release_assets/PhoneMicReceiver-Linux.tar.gz -C staging PhoneMicReceiver-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMicReceiver-Linux
          path: release_assets/PhoneMicReceiver-Linux.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Publish Manual GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Release (APK + Windows + Linux)
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: PhoneMic-debug-apk
          path: release_files

      - name: Download Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: PhoneMicReceiver-Windows
          path: release_files

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: PhoneMicReceiver-Linux
          path: release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title || github.event.inputs.tag_name }}
          draft: ${{ github.event.inputs.is_draft == 'true' }}
          prerelease: false
          files: |
            release_files/PhoneMic-debug.apk
            release_files/PhoneMicReceiver-Windows.zip
            release_files/PhoneMicReceiver-Linux.tar.gz
          generate_release_notes: true
          body: |
            ## PhoneMic Release ${{ github.event.inputs.tag_name }}

            Download the pre-compiled binaries below:

            ### 📱 Android Application
            * **`PhoneMic-debug.apk`**: Install on your Android phone to stream microphone audio over Wi-Fi or USB tethering. Supports Studio (48 kHz), Balanced (24 kHz), and Economy (16 kHz) audio profiles.

            ### 💻 Windows Receiver
            * **`PhoneMicReceiver-Windows.zip`**: Includes:
              * **`PhoneMicReceiver.exe`**: Full Windows GUI with real-time signal processing (EQ, Noise Gate, Compressor, Voice Changer, Limiter).
              * **`phonemic_cli.py`**: Lightweight standalone CLI receiver with live terminal VU meters, multi-phone mixing, and real-time headphone monitoring (`M` key).
              * **`fix_firewall.bat`**: One-click Windows firewall configuration for USB tethering and Wi-Fi streaming.

            ### 🐧 Linux Receiver (Arch, Ubuntu, Debian, Fedora, etc.)
            * **`PhoneMicReceiver-Linux.tar.gz`**: Includes:
              * **`PhoneMicReceiver`**: Pre-built standalone Linux executable (requires system PortAudio + PipeWire/PulseAudio, e.g. `libportaudio2 pipewire-pulse`).
              * **`phonemic_cli.py`**: Lightweight standalone CLI receiver.
              * **`setup_linux.sh` / `start_receiver.sh` / `linux/PKGBUILD`**: Automated `.venv` + desktop menu setup for Arch Linux (auto-installs packages) and any other Linux distro (`python3-tk` + PortAudio + PipeWire/PulseAudio).
