name: Build Windows Receiver EXE

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller sounddevice numpy

      - name: Build PhoneMicReceiver.exe
        working-directory: windows_receiver
        run: |
          pyinstaller --clean PhoneMicReceiver.spec

      - name: Package Windows Receiver ZIP
        run: |
          Copy-Item windows_receiver/fix_firewall.bat windows_receiver/dist/
          Copy-Item windows_receiver/phonemic_cli.py windows_receiver/dist/
          Copy-Item windows_receiver/README.md windows_receiver/dist/
          Compress-Archive -Path windows_receiver/dist/* -DestinationPath PhoneMicReceiver-Windows.zip -Force

      - name: Upload PhoneMicReceiver artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMicReceiver-Windows
          path: PhoneMicReceiver-Windows.zip

      - name: Attach to GitHub Release (when tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhoneMicReceiver-Windows.zip
