name: Build Windows Receiver EXE

on:
  push:
    paths:
      - 'windows_receiver/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller sounddevice numpy

      - name: Build PhoneMicReceiver.exe
        working-directory: windows_receiver
        run: |
          pyinstaller --clean PhoneMicReceiver.spec

      - name: Copy auxiliary scripts
        working-directory: windows_receiver
        run: |
          Copy-Item fix_firewall.bat dist/
          Copy-Item README.md dist/

      - name: Upload PhoneMicReceiver artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMicReceiver-Windows-v0.6.5
          path: windows_receiver/dist/
